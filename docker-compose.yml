name: vigil

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - venv-cache:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - dev

  api:
    image: ghcr.io/${IMAGE_OWNER:-y6w19-hue}/vigil-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - CONFIG_PATH=configs/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit:
    image: ghcr.io/${IMAGE_OWNER:-y6w19-hue}/vigil-streamlit:latest
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  web:
    image: ghcr.io/${IMAGE_OWNER:-y6w19-hue}/vigil-web:latest
    ports:
      - "3000:80"
    depends_on:
      - api

  web-dev:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - api
    profiles:
      - dev

  simulator:
    image: ghcr.io/${IMAGE_OWNER:-y6w19-hue}/vigil-api:latest
    command:
      ["python", "-m", "alerts.simulator", "--rate", "5", "--limit", "500"]
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    profiles:
      - demo

volumes:
  venv-cache:
